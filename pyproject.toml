[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-toolkit"
version = "0.1.4"
description = "Common toolkit for FastAPI + SQLAlchemy projects: async DB sessions, base CRUD, settings with AWS Secrets Manager"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Timophey Akulich", email = "tima.akulich@gmail.com" },
]
keywords = [
    "fastapi",
    "sqlalchemy",
    "crud",
    "async",
    "toolkit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "sqlalchemy[asyncio]>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
aws = [
    "botocore>=1.30.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.4.0",
]

[project.urls]
Repository = "https://github.com/timaakulich/fastapi-toolkit"
Issues = "https://github.com/timaakulich/fastapi-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_toolkit"]

[tool.hatch.build.targets.sdist]
exclude = [
    "tests/",
    ".github/",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "UP007",
]

[tool.ruff.lint.isort]
known-first-party = ["fastapi_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
